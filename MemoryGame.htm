<!DOCTYPE html>
<html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>MEMORY GAME</title>
	<style>
	</style>

	<script>

		const nMenu = 64; // numero de opciones del menu
		let primero = null; // primer cuadrado pulsado, null significa que todavía no hay ninguno pulsado
		let segundo = null; // segundo cuadrado pulsado
		let timer;
		let contador = 0;
		let jugando = false;
		let terminado = false;

		function iniciar() {
			// tamaño disponible: el menor entre el ancho y el alto de la pantalla
			let espacio = Math.min(window.innerWidth - 24, window.innerHeight * 0.65);
			let caja = Math.floor(espacio / 4) - 16; // cada caja ocupa caja + 16px (borde, padding y margen)
			if (caja > 300) caja = 300; // máximo, para que no sea gigante en pantallas grandes
			let ancho = (caja + 16) * 4; // ancho del tablero
			//centramos todo el body
			document.body.style.backgroundColor = '#fff0f5';
			document.body.style.margin = '0';
			document.body.style.minHeight = '100vh';
			document.body.style.display = 'flex';
			document.body.style.flexDirection = 'column';
			document.body.style.justifyContent = 'center';
			document.body.style.alignItems = 'center';
			document.body.style.fontFamily = 'Arial, sans-serif';
			document.getElementById('demo').style.fontSize = (caja * 0.25) + 'px';
			document.getElementById('demo').style.fontWeight = 'bold';

			//Botón
			let boton = document.querySelector('button');
			boton.style.width = (ancho * 0.45) + 'px';
			boton.style.height = (caja * 0.4) + 'px';
			boton.style.fontSize = (caja * 0.2) + 'px';
			boton.style.fontWeight = 'bold';
			boton.style.backgroundColor = 'white';
			boton.style.border = '3px solid pink';
			boton.style.borderRadius = '30px';
			boton.style.color = 'black';
			boton.style.fontFamily = 'Arial, sans-serif';

			//Points
			let points = document.getElementById('points');
			points.style.fontSize = (caja * 0.3) + 'px';
			points.style.margin = '0px';
			points.style.fontWeight = 'bold';
			
			//Reload Button
			let reload = document.getElementById('reload');
			reload.style.width = (caja * 0.5) + 'px';
			reload.style.height = (caja * 0.5) + 'px';
			reload.style.backgroundColor = 'pink';
			reload.style.backgroundImage = 'url(img/reload.png)';
			reload.style.backgroundSize = '70%';
			reload.style.backgroundPosition = 'center';
			reload.style.backgroundRepeat = 'no-repeat';
			reload.style.border = 'none';
			reload.style.borderRadius = '50%';

			// fila de arriba: reload a la izquierda, puntos a la derecha
			let filaPuntos = crearNodo('div', '', 'filaPuntos');
			filaPuntos.style.display = 'flex';
			filaPuntos.style.justifyContent = 'space-between';
			filaPuntos.style.alignItems = 'center';
			filaPuntos.style.width = ancho + 'px';
			filaPuntos.style.marginBottom = '20px';
			filaPuntos.appendChild(reload); // left
			filaPuntos.appendChild(points); // right

			//Tablero
			let tablero = crearNodo('div', '', 'tablero');
			tablero.style.width = ancho + 'px';
			tablero.style.overflow = 'hidden';

			//Barra debajo de Tablerp
			let barra = crearNodo('div', '', 'barra');
			barra.style.display = 'flex';
			barra.style.justifyContent = 'space-between'; // uno a cada lado
			barra.style.alignItems = 'center';
			barra.style.width = ancho + 'px';
			barra.style.marginTop = '30px';

			// movemos el botón y el contador a la barra
			barra.appendChild(document.querySelector('button')); // izquierda
			let demo = document.getElementById('demo');
			demo.style.margin = '0px';
			barra.appendChild(demo); // derecha


			let fotos = ['img/edge2edge-media-6gvHkTmC3Bo-unsplash.jpg',
				'img/katriona-mccarthy-l7B7VjYL7pk-unsplash.jpg',
				'img/katriona-mccarthy-sGYlyg_U92I-unsplash.jpg',
				'img/klara-kulikova-glyAISndbac-unsplash.jpg',
				'img/marianne-krohn-HV3XfirsXp8-unsplash.jpg',
				'img/mick-de-paola-hiVfcLGGYtE-unsplash.jpg',
				'img/olga-drach-mCufwx_aycM-unsplash.jpg',
				'img/pawel-czerwinski-jtes8PJxxj8-unsplash.jpg']; // colores repetidos para las parejas 

			for (let i = 0; i < fotos.length; i++) {
				let img = new Image();
				img.src = fotos[i]; // el navegador la descarga ahora y la guarda
			}

			let imagenes = fotos.concat(fotos); // cada foto dos veces

			imagenes.sort(function () { //mezcla la lista para que las parejas queden en sitios al azar
				return Math.random() - 0.5;
			});
			let num = 0; //posicion del color que le toca al siguiente cuadrado

			for (let fila = 1; fila < 5; fila++) {
				for (let col = 1; col < 5; col++) {

					var ele = crearNodo('div', '', '(fila,col)'); //crea el div y lo añade al body
					tablero.appendChild(ele); // lo mueve del body al tablero

					ele.colorOculto = imagenes[num]; // color secreto de este cuadrado
					num++;//el siguiente cuadrado usará el siguiente color

					ele.style.border = '3px solid pink';
					ele.style.backgroundColor = 'pink';
					ele.style.borderRadius = '32%'
					ele.style.height = caja + 'px';
					ele.style.width = caja + 'px';
					ele.style.margin = '3px';
					ele.style.padding = '2px';
					ele.style.float = 'left'; // cajas en linea
					ele.style.backgroundSize = 'cover';
					ele.style.backgroundPosition = 'center';
					ele.style.backgroundRepeat = 'no-repeat';

					if (col == 1) ele.style.clear = 'left'; //salto linea cada

					ele.addEventListener('click', clickMenu);
				}
			}
		}
		function crearNodo(tipo, inner, id) {
			// crea el nodo, lo pone en el body
			var ele = document.createElement(tipo);
			document.body.appendChild(ele); // añadir al body el elemento div por abajo
			ele.innerHTML = inner; // contenido
			ele.id = id; // id del nodo
			return ele; // retorna la referencia
		}
		function startCountdown() {
			if (terminado) {
				location.reload();
				return;
			}
			jugando = true;
			clearInterval(timer);
			let count = 60;
			myDisplayer(count);

			timer = setInterval(function () {
				count--;
				myDisplayer(count);

				if (count === 0) {
					clearInterval(timer);
					jugando = false;
					terminado = true;
					myDisplayer("Try again!");
				}
			}, 1000);
		}

		// Function to display any text
		function myDisplayer(text) {
			let demo = document.getElementById("demo");
			demo.innerHTML = text;
		}

		function clickMenu() {
			if (!jugando) return;
			// Ignorar si ya está descubierto (acertado o ya pulsado)
			if (this.style.backgroundColor != 'pink') return; // si el cuadrado no es rosa no hacemos nada

			// Tercer click: si había dos descubiertos sin acertar, taparlos
			if (segundo != null) {
				primero.style.backgroundColor = 'pink';
				primero.style.backgroundImage = 'none';
				segundo.style.backgroundColor = 'pink';
				segundo.style.backgroundImage = 'none';
				primero = null; //vaciamos para empezar nueva jugada
				segundo = null;
			}

			// Descubrir el cuadrado pulsado poniendole su color oculto
			this.style.backgroundColor = 'white';
			this.style.backgroundImage = 'url(' + this.colorOculto + ')';

			if (primero == null) {
				primero = this;// es el primero de la jugada, no había nada guardado
			} else {
				segundo = this;// ya había uno, este es el segundo
				if (primero.colorOculto == segundo.colorOculto) { //se quedan destapados
					primero = null;
					segundo = null;
					contador++;
					document.getElementById('points').innerHTML = 'Points: ' + contador
				}
			}
			if (contador == 8) {
				clearInterval(timer);
				jugando = false;
				terminado = true;
				myDisplayer("Congratulations!");
			}



		}


		window.onload = iniciar; // inicio de js al terminar la carga de la pagina
	</script>
</head>

<body>
	<button onclick="startCountdown()">Start Countdown</button>
	<button onclick="location.reload()" id="reload"></button>
	<p id="demo"></p>
	<p id="points">Points: 0</p>

</body>

</html>
